# Devpod overrides: make this machine match the devpod config (/tmp/tmux.conf)

# This machine only: Ctrl+b is the sole prefix (drop the C-t prefix2 so it doesn't clash with the other tmux)
set-option -g prefix C-b
set-option -gu prefix2
bind C-b send-prefix

# Resurrect save location
set -g @resurrect-dir '~/.config/tmux/resurrect'

# No session_manager popup
unbind K

# Active window title colour (purple instead of orange)
set-window-option -g window-status-current-style fg=colour135,bg=default,bright

# Pane title display
set-option -g pane-border-status bottom
set-option -g pane-border-format "#[fg=colour160] #{pane_index}: #{?@label,#[fg=colour33]#{@label}#[fg=colour160] | ,}#[fg=colour136]#{pane_title} "

# OSC 52 clipboard sync
set -g set-clipboard on
set -g allow-passthrough on
set -ga terminal-features ",alacritty:sixel"
set -ga terminal-features ",xterm-256color:sixel"

# gogo-mux: sidebar focus keybinding
bind e run-shell "/home/kevin/.local/bin/gogo-mux sidebar focus '#{pane_id}' '#{@gogo_sidebar}' '#{session_name}'"
